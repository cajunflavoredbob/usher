name: Build & publish image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

      # The panel, startup DM and /status all report _version.py, so a tag
      # that disagrees with it would publish an image naming the wrong
      # version.
      - name: Tag matches _version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import _version; print(_version.__version__)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match _version.py ($v)"
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Import smoke test on the ACTUAL image before anything is pushed:
      # pytest runs from the repo checkout, so it can't catch packaging
      # failures (v0.12.0 shipped without two new modules and crash-looped
      # on the first import).
      - name: Image import smoke test
        run: |
          docker build -t usher-smoke .
          docker run --rm usher-smoke python -c "import bot.app; print('import ok')"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Pushed to both registries simultaneously
          images: |
            ghcr.io/${{ github.repository_owner }}/usher
            ${{ secrets.DOCKERHUB_USERNAME }}/usher
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Only a version tag publishes (semver tags also get :latest by
          # default); a manual run from a branch builds without pushing.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
